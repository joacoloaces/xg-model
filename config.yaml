paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: outputs/models
  reports_dir: outputs/reports

data:
  gender: null          # null = hombres + mujeres (con "male" solo había ~2650 partidos)
  include_youth: false
  competitions: []
  exclude_competitions: []
  min_season: null
  max_matches: null
  n_workers: 8
  refresh: false

preprocessing:
  exclude_penalties: true

split:
  strategy: group
  test_size: 0.2
  temporal_cutoff: "2021-01-01"
  test_competitions: [FIFA World Cup, UEFA Euro, Copa America, African Cup of Nations]
  random_state: 42

training:
  models: [logreg, xgboost, lightgbm, catboost]
  ensemble_size: 3
  cv_folds: 5
  cv_group: match
  n_iter: 20
  n_jobs: -1
  random_state: 42

report:
  thresholds:
    start: 0.1
    stop: 0.9
    step: 0.1

loco:
  model: best_model
  min_shots: 100
  n_jobs: -1